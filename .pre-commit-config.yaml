default_install_hook_types:
  - pre-commit
  - post-commit
  - post-merge

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: precommit
        name: pre-commit pytest evidence
        entry: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE uv run --frozen pytest precommit
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: mypy
        name: mypy (locked env)
        entry: uv run --no-sync mypy --config-file=pyproject.toml
        language: system
        pass_filenames: false
      - id: postcommit
        name: shared post-commit evidence
        entry: uv run --frozen pytest --rootdir . -o addopts= postcommit
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-commit, post-merge]

  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.14
    hooks:
      - id: vulture
        args: ["--config=pyproject.toml"]
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.8
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: tools-md-check
        name: Check TOOLS.md is up to date
        entry: uv run --no-sync python -m mcp_langfuse.tools_markdown --check
        language: system
        pass_filenames: false
